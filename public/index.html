  <style>
    .app-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f6f4f1; z-index: 9999; }
    .app-loader-inner { text-align: center; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    .app-loader-logo { width: 50px; height: 50px; background: linear-gradient(135deg, #fb8a3c, #ea580c); color: #fff; display: grid; place-items: center; border-radius: 12px; font-weight: 800; font-size: 22px; margin: 0 auto 16px; box-shadow: 0 6px 16px -4px rgba(234,88,12,.5); }
    .app-loader-text { color: #5a6877; font-size: 14px; font-weight: 500; }
    .app-loader-bar { width: 120px; height: 3px; background: #e6eaf0; border-radius: 3px; margin: 12px auto 0; overflow: hidden; }
    .app-loader-fill { width: 40%; height: 100%; background: #ea580c; border-radius: 3px; animation: loader-slide 1s ease-in-out infinite; }
    @keyframes loader-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
